name: Daily Staff Augmentation Leads Build

on:
  schedule:
    # 03:00 UTC corresponds to 08:30 AM IST every day
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Leads Update Script
        run: |
          python update_leads.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies.csv
          if git diff --staged --quiet; then
            echo "No changes in companies.csv"
          else
            git commit -m "chore(leads): daily update at 8:30 AM IST [$(date +'%Y-%m-%d')]"
            git push
          fi
